<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f26"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#140f26"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  
      <defs>
        <radialGradient id="orb" cx="38%" cy="32%">
          <stop offset="0" stop-color="#f5d0fe"/>
          <stop offset="55%" stop-color="#e879f9"/>
          <stop offset="100%" stop-color="#8b5cf6"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
      </defs>
      <circle cx="430" cy="420" r="250" fill="#e879f9" opacity="0.35" filter="url(#blur)"/>
      <circle cx="470" cy="390" r="215" fill="url(#orb)"/>
      <ellipse cx="450" cy="440" rx="360" ry="88" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.55" transform="rotate(-18 450 440)"/>
      <ellipse cx="450" cy="440" rx="320" ry="190" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.3" transform="rotate(24 450 440)"/>
      <circle cx="700" cy="190" r="4" fill="#f5d0fe"/>
      <circle cx="170" cy="560" r="2.5" fill="#f5d0fe" opacity="0.7"/>
      <circle cx="600" cy="660" r="3" fill="#f5d0fe" opacity="0.5"/>
    
  <rect width="800" height="800" fill="url(#shade)"/>
  <rect width="800" height="800" filter="url(#grain)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#fff">
    <text x="56" y="622" font-size="19" letter-spacing="5" opacity="0.7">MUSIC PLAYER 1228 · PIANO</text>
    <text x="56" y="700" font-size="56" font-weight="700" letter-spacing="-1">Стежками снів</text>
    <text x="56" y="750" font-size="26" opacity="0.85">Myla — DREAM PATHS</text>
  </g>
  <rect x="56" y="560" width="46" height="4" fill="#e879f9"/>
</svg>