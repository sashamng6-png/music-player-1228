<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21130d"/>
      <stop offset="0.55" stop-color="#b45309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#21130d"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  
      <circle cx="300" cy="330" r="260" fill="#b45309" opacity="0.6"/>
      <circle cx="560" cy="520" r="180" fill="#fbbf24" opacity="0.35"/>
      <rect x="90" y="560" width="620" height="3" fill="#fef3c7" opacity="0.7"/>
    
  <rect width="800" height="800" fill="url(#shade)"/>
  <rect width="800" height="800" filter="url(#grain)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#fff">
    <text x="56" y="622" font-size="19" letter-spacing="5" opacity="0.7">MUSICFLOW · JAZZ</text>
    <text x="56" y="700" font-size="56" font-weight="700" letter-spacing="-1">Кав’ярня на розі</text>
    <text x="56" y="750" font-size="26" opacity="0.85">Trio Sonechko — JAZZ &amp; КАВА</text>
  </g>
  <rect x="56" y="560" width="46" height="4" fill="#fbbf24"/>
</svg>