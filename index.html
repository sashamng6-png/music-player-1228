<!doctype html>
<html lang="uk" data-theme="dark" data-accent="teal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta
      name="description"
      content="MusicFlow — сучасний музичний плеєр: бібліотека, плейлисти, улюблене, історія та візуалізатор. Працює офлайн, без бекенду."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MusicFlow — сучасний музичний плеєр</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      try {
        var stored = JSON.parse(localStorage.getItem('musicflow.settings.v1') || '{}');
        var root = document.documentElement;
        root.dataset.theme = stored.theme === 'light' ? 'light' : 'dark';
        root.dataset.accent = stored.accent || 'teal';
        root.dataset.motion = stored.reduceMotion ? 'reduced' : 'full';
        root.dataset.playerSize = stored.playerSize === 'compact' ? 'compact' : 'comfortable';
      } catch (error) {
        /* first visit — defaults from the HTML element apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для роботи MusicFlow потрібно увімкнути JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
